name: Probe ECO Sticker JAECOO 5

on:
  push:
    branches:
      - feature/jaecoo-j5-market-trims

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public ECO Sticker records
        run: |
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          base = "https://api-car.ecosticker.go.th/api/v2/landing-page/cars"
          detail_base = "https://api-car.ecosticker.go.th/api/v1/eco-sticker/public/by-car-id"
          terms = ["JAECOO", "JAECOO5", "J5", "5 EV", "OMODA JAECOO"]
          unique = {}

          for term in terms:
              params = urllib.parse.urlencode({"page": 1, "row": 100, "search": term, "sort": ""})
              req = urllib.request.Request(f"{base}?{params}", headers={"User-Agent": "vehicle-market-master/1.0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  listing = json.load(r)
              rows = listing.get("data", {}).get("car_list", [])
              print("SEARCH", term, "COUNT", len(rows))
              print(json.dumps(rows, ensure_ascii=False))
              for row in rows:
                  car_id = row.get("id")
                  if car_id:
                      unique[car_id] = row

          candidates = [
              row for row in unique.values()
              if any(token in (str(row.get("brand", "")) + " " + str(row.get("model", ""))).upper()
                     for token in ("JAECOO", "J5", "JAECOO5", "JAECOO 5"))
          ]
          print("CANDIDATES_BEGIN")
          print(json.dumps(candidates, ensure_ascii=False))
          print("CANDIDATES_END")

          details = []
          for row in candidates:
              car_id = row["id"]
              url = detail_base + "?" + urllib.parse.urlencode({"car_id": car_id})
              req = urllib.request.Request(url, headers={"User-Agent": "vehicle-market-master/1.0"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      details.append({"list": row, "detail": json.load(r)})
              except Exception as exc:
                  details.append({"list": row, "error": repr(exc)})

          print("DETAIL_RESPONSES_BEGIN")
          print(json.dumps(details, ensure_ascii=False))
          print("DETAIL_RESPONSES_END")
          PY
