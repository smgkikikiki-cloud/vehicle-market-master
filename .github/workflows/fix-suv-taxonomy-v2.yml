name: Fix SUV taxonomy v2

on:
  push:
    branches:
      - fix/suv-body-taxonomy-v2

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply migration
        run: |
          python scripts/migrate_suv_taxonomy.py
          sed -i 's/BodyType.parse("body on frame suv"), BodyType.PPV/BodyType.parse("body on frame suv"), BodyType.OFFROAD/' tests/test_vehreg.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Test
        run: |
          python -m compileall -q vehreg pages tests
          pytest -q
      - name: Validate body taxonomy
        run: PYTHONPATH=. python scripts/validate_suv_taxonomy.py
      - name: Commit generated changes
        run: |
          git config user.name "smgkikikiki-cloud"
          git config user.email "smgkikikiki@gmail.com"
          git add vehreg pages tests docs
          git commit -m "Align SUV taxonomy to Crossover PPV Offroad" || true
          git push
