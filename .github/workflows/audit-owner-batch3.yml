name: Audit owner powertrain batch3

on:
  push:
    branches: [feature/owner-powertrain-batch3]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Inspect selected model labels by period
        run: |
          python - <<'PY'
          from pathlib import Path
          from vehreg.web_bootstrap import bootstrap_database
          from vehreg.db import connect

          db = Path('/tmp/batch3-audit.sqlite3')
          bootstrap_database(db)
          conn = connect(db)
          targets = [
              ('MINI','Countryman'),
              ('Audi','A5'),
              ('BMW','4 Series'),
              ('MINI','Cooper'),
          ]
          for brand, model in targets:
              print(f'=== {brand} | {model} ===')
              rows = conn.execute('''
                  SELECT f.period, f.raw_label, SUM(f.units) AS units,
                         d.powertrain
                  FROM fact_registration f
                  JOIN dim_unit d ON d.unit_id=f.unit_id
                  WHERE d.grain='MODEL' AND upper(d.brand)=upper(?) AND upper(d.model)=upper(?)
                  GROUP BY f.period, f.raw_label, d.powertrain
                  ORDER BY f.period, units DESC, f.raw_label
              ''', (brand, model)).fetchall()
              for r in rows:
                  print(r['period'], '|', r['raw_label'], '|', int(r['units']), '| base=', r['powertrain'])
          conn.close()
          PY
