name: Apply Phase 1 MarketTrim schema hardening

on:
  push:
    branches:
      - phase1/markettrim-powertrain-dimensions
    paths:
      - .github/workflows/phase1-markettrim-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply code-only MarketTrim schema patch
        run: python scripts/phase1_markettrim_patch.py
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Compile
        run: python -m compileall -q vehreg pages tests
      - name: Test
        run: pytest -q
      - name: Commit hardened schema
        run: |
          git config user.name "smgkikikiki-cloud"
          git config user.email "smgkikikiki@gmail.com"
          git add vehreg/catalog.py
          git commit -m "Harden MarketTrim powertrain and dimensions contract"
          git push origin HEAD:phase1/markettrim-powertrain-dimensions
