name: Apply owner powertrain rules

on:
  push:
    branches:
      - feature/owner-powertrain-rules
    paths:
      - tools/apply_owner_powertrain_rules.py
      - .github/workflows/apply-owner-powertrain-rules.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/owner-powertrain-rules
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reviewed rules
        run: python tools/apply_owner_powertrain_rules.py
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile
        run: python -m compileall -q vehreg pages tests
      - name: Test
        run: pytest -q
      - name: Commit tested changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm tools/apply_owner_powertrain_rules.py .github/workflows/apply-owner-powertrain-rules.yml
          git add vehreg/powertrain_rules.py vehreg/cube.py vehreg/coverage.py tests/test_powertrain_rules.py docs/HANDOVER.md
          git commit -m 'Apply owner-reviewed powertrain rules'
          git push origin HEAD:feature/owner-powertrain-rules
