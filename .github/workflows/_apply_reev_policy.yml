name: Apply REEV reader policy

on:
  push:
    branches:
      - feature/reev-reader-bucket

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/reev-reader-bucket
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Apply policy patch
        run: python tools/_apply_reev_policy.py

      - name: Compile
        run: python -m compileall -q vehreg pages tests app.py

      - name: Run tests
        run: pytest -q

      - name: Commit tested patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep REEV separate from HEV in reader-facing taxonomy"
          git push origin HEAD:feature/reev-reader-bucket
