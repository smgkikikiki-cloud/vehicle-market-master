name: Fix SUV taxonomy

on:
  push:
    branches: [fix/suv-body-taxonomy]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply canonical SUV taxonomy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('vehreg/taxonomy.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
'''    CROSSOVER = "CROSSOVER"          # monocoque, car-derived
    SUV = "SUV"                      # monocoque, SUV-proportioned
    PPV = "PPV"                      # body-on-frame SUV built off a pickup
''',
'''    CROSSOVER = "CROSSOVER"          # all monocoque SUVs/crossovers
    PPV = "PPV"                      # pickup-derived passenger vehicle (Fortuner, Everest, MU-X, etc.)
    OFFROAD = "OFFROAD"              # ladder-frame SUV that is not pickup-derived
''')
          s = s.replace('BODY_ON_FRAME = frozenset({BodyType.PPV, BodyType.PICKUP})',
                        'BODY_ON_FRAME = frozenset({BodyType.PPV, BodyType.OFFROAD, BodyType.PICKUP})')
          s = s.replace(
'''        "HATCHBACK": "แฮทช์แบ็ก", "SEDAN": "ซีดาน", "CROSSOVER": "ครอสโอเวอร์",
        "SUV": "เอสยูวี", "PPV": "เอสยูวีบอดี้ออนเฟรม (PPV)", "COUPE": "คูเป้",
''',
'''        "HATCHBACK": "แฮทช์แบ็ก", "SEDAN": "ซีดาน", "CROSSOVER": "ครอสโอเวอร์ / SUV โมโนค็อก",
        "PPV": "PPV พื้นฐานกระบะ", "OFFROAD": "SUV ออฟโรดโครงแชสซีส์", "COUPE": "คูเป้",
''')
          s = s.replace(
'''    "BodyType": {
        "SUV_BOF": "PPV", "BODY_ON_FRAME_SUV": "PPV", "PPV_SUV": "PPV",
        "MINIVAN": "MPV", "CONVERTIBLE": "COUPE",
''',
'''    "BodyType": {
        "SUV": "CROSSOVER", "MONOCOQUE_SUV": "CROSSOVER", "UNIBODY_SUV": "CROSSOVER",
        "PPV_SUV": "PPV", "PICKUP_DERIVED_SUV": "PPV",
        "SUV_BOF": "OFFROAD", "BODY_ON_FRAME_SUV": "OFFROAD",
        "LADDER_FRAME_SUV": "OFFROAD", "OFFROAD_SUV": "OFFROAD", "OFFROAD_LADDER_FRAME": "OFFROAD",
        "MINIVAN": "MPV", "CONVERTIBLE": "COUPE",
''')
          if 'OFFROAD = "OFFROAD"' not in s:
              raise SystemExit('taxonomy edit failed: OFFROAD missing')
          p.write_text(s, encoding='utf-8')

          offroad = {
              'toyota.land_cruiser_300',
              'lexus.lx',
              'gwm.tank300',
              'gwm.tank500',
              'mercedes_benz.g_class',
              'suzuki.jimny',
              'jeep.wrangler',
          }
          changed = []
          counts = {'CROSSOVER':0, 'PPV':0, 'OFFROAD':0}
          for fp in sorted(Path('vehreg/data').glob('*/models/*.json')):
              data = json.loads(fp.read_text(encoding='utf-8'))
              brand_id = data['brand']['id']
              dirty = False
              for m in data.get('models', []):
                  full = f"{brand_id}.{m['id']}"
                  old = m.get('body_type')
                  if full in offroad and old in ('SUV','PPV','CROSSOVER','OFFROAD'):
                      new = 'OFFROAD'
                  elif old == 'SUV':
                      new = 'CROSSOVER'
                  else:
                      new = old
                  if new != old:
                      m['body_type'] = new
                      changed.append((str(fp), full, old, new))
                      dirty = True
                  if m.get('body_type') in counts:
                      counts[m['body_type']] += 1
              if dirty:
                  fp.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('BODY_MIGRATIONS', len(changed))
          for row in changed:
              print(*row, sep=' | ')
          print('BODY_COUNTS_ALL_YEARS', counts)

          d = Path('docs/VEHREG_TAXONOMY.md')
          text = d.read_text(encoding='utf-8')
          text = text.replace('| `body_type` | HATCHBACK, SEDAN, CROSSOVER, SUV, PPV, COUPE, MPV, PICKUP, OTHER |',
                              '| `body_type` | HATCHBACK, SEDAN, CROSSOVER, PPV, OFFROAD, COUPE, MPV, PICKUP, WAGON, VAN, TRUCK, OTHER |')
          marker = '## Vocabulary ทั้งหมด\n'
          expl = '''## SUV body taxonomy\n\nVehicle Master ใช้ SUV สามกลุ่มเท่านั้น:\n\n- `CROSSOVER` = SUV/crossover โครงสร้าง monocoque หรือ unibody ทุกขนาด\n- `PPV` = รถนั่งที่พัฒนาจากแพลตฟอร์มกระบะ เช่น Fortuner, Everest, MU-X, Pajero Sport, Terra\n- `OFFROAD` = SUV โครงแชสซีส์/ladder frame ที่ไม่ใช่ pickup-derived เช่น Land Cruiser 300, Lexus LX, Tank 300/500, G-Class, Jimny, Wrangler\n\nคำว่า `SUV` เก่าเป็น input alias ไป `CROSSOVER` เท่านั้นและไม่ใช่ canonical value อีกต่อไป เพื่อไม่ให้ monocoque กับ ladder-frame ปนกัน\n\n'''
          if '## SUV body taxonomy' not in text:
              text = text.replace(marker, expl + marker)
          d.write_text(text, encoding='utf-8')
          PY
      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          python -m compileall -q vehreg pages tests
          pytest -q
      - name: Validate 2026 body split
        run: |
          python - <<'PY'
          from collections import Counter
          from vehreg.catalog import Catalog
          from vehreg.taxonomy import BodyType
          c = Catalog.load(year=2026)
          cnt = Counter(m.body_type.value for m in c.models.values())
          print('CATALOG_2026_BODY_COUNTS', dict(sorted(cnt.items())))
          print('OFFROAD', sorted(m.id for m in c.models.values() if m.body_type is BodyType.OFFROAD))
          print('PPV', sorted(m.id for m in c.models.values() if m.body_type is BodyType.PPV))
          assert 'SUV' not in cnt
          assert cnt['OFFROAD'] == 7, cnt
          assert cnt['PPV'] == 5, cnt
          PY
      - name: Commit migration
        run: |
          git config user.name "smgkikikiki-cloud"
          git config user.email "smgkikikiki@gmail.com"
          git add vehreg/taxonomy.py vehreg/data docs/VEHREG_TAXONOMY.md
          git commit -m "Align SUV body taxonomy to Crossover PPV Offroad" || true
          git push
