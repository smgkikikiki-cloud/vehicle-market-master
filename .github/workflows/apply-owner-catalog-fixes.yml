name: Apply owner catalog powertrain fixes

on:
  push:
    branches: [feature/owner-powertrain-rules]
    paths:
      - tools/apply_owner_catalog_fixes.py
      - .github/workflows/apply-owner-catalog-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/owner-powertrain-rules
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply catalog fixes
        run: python tools/apply_owner_catalog_fixes.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile and test
        run: |
          python -m compileall -q vehreg pages tests
          pytest -q
      - name: Fresh warehouse integrity audit
        env:
          VEHREG_DB: /tmp/catalog-fixes.sqlite3
        run: |
          python - <<'PY'
          from pathlib import Path
          from vehreg.web_bootstrap import bootstrap_database
          from vehreg.db import connect
          from vehreg import review, coverage, cube, trimledger
          from vehreg.powertrain_rules import RULES

          db = Path('/tmp/catalog-fixes.sqlite3')
          report = bootstrap_database(db)
          conn = connect(db)
          total = float(conn.execute('select coalesce(sum(units),0) u from fact_registration').fetchone()['u'])
          facts = int(conn.execute('select count(*) n from fact_registration').fetchone()['n'])
          review_units = float(conn.execute("select coalesce(sum(units),0) u from ingest_review where status='open'").fetchone()['u'])
          print('BOOT', report)
          print('FACTS', facts, 'UNITS', total, 'OPEN_REVIEW_UNITS', review_units)
          assert total == 4064148.0, total
          assert facts == 35212, facts
          rec = trimledger.reconcile(conn)
          print('TRIM_RECONCILE', len(rec))
          assert not rec, rec[:5]

          catalogs = review.load_catalogs()
          wl = coverage.assumed_powertrain(conn, catalogs)
          print('WORKLIST', len(wl), 'UNITS', round(sum(float(x['units']) for x in wl)))
          for x in wl[:30]: print('WL', x)

          result = cube.run(conn, ['powertrain'], scopes='all')
          print('POWERTRAIN')
          for row in result.rows: print(row['powertrain'], round(row['units']))

          known = set()
          for cat in catalogs.values():
              for model in cat.models.values():
                  brand = cat.brands[model.brand_id].name_en
                  known.add((brand.upper(), model.name_en.upper()))
          misses = sorted({(r.brand, r.model) for r in RULES
                           if r.model != '*' and (r.brand.upper(), r.model.upper()) not in known})
          print('RULE_KEY_MISSES', len(misses), misses)
          assert not misses, misses

          checks = {
              'IS': ('LEXUS IS300H', 'lexus.lexus_is'),
              'LS': ('LEXUS LS500H', 'lexus.lexus_ls'),
              'PRIUS': ('TOYOTA PRIUS', 'toyota.prius'),
          }
          for name, (label, expected) in checks.items():
              row = conn.execute("select unit_id,sum(units) units from fact_registration where upper(raw_label)=? group by unit_id order by units desc limit 1", (label,)).fetchone()
              print('CHECK', name, dict(row) if row else None)
              if row:
                  assert row['unit_id'] == expected, (name, dict(row))
          conn.close()
          PY
      - name: Commit tested changes and remove one-shot files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm tools/apply_owner_catalog_fixes.py .github/workflows/apply-owner-catalog-fixes.yml
          git add vehreg/powertrain_rules.py tests/test_powertrain_catalog_fixes.py vehreg/data/*/models/lexus.json vehreg/data/*/models/toyota.json
          git commit -m 'Fix owner-reviewed powertrain catalog targets'
          git push origin HEAD:feature/owner-powertrain-rules
