name: Test vehicle market

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Compile Python
        run: python -m compileall -q vehreg pages tests

      - name: Run backfill regression
        run: pytest -q tests/test_backfill_2026.py

      - name: Run tests
        run: pytest -q
