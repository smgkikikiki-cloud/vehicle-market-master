name: Price feed

# Scheduled runs on GitHub are best-effort: they queue under load and can be
# dropped. That is why the poll asks for everything modified since the last
# successful run rather than only what is new right now -- a missed run costs
# twenty minutes, not a launch.
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      since:
        description: "ISO timestamp to poll from (default: 3 hours ago)"
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pricefeed
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Choose the window
        id: window
        run: |
          if [ -n "${{ inputs.since }}" ]; then
            echo "since=${{ inputs.since }}" >> "$GITHUB_OUTPUT"
          else
            echo "since=$(date -u -d '3 hours ago' +%Y-%m-%dT%H:%M:%S)" >> "$GITHUB_OUTPUT"
          fi

      - name: Harvest price news
        run: |
          python tools/pricefeed_harvest.py \
            --since "${{ steps.window.outputs.since }}" \
            --limit 60 --delay 1.0 \
            --out vehreg/data/2026/market/pricefeed/batch-$(date -u +%Y-%m-%dT%H%M).json

      - name: Decide what may publish
        run: |
          latest=$(ls -1 vehreg/data/2026/market/pricefeed/batch-*.json | tail -1)
          python -m vehreg market price-run "$latest" \
            --decisions vehreg/data/2026/market/pricefeed/review/decisions.json \
            --write | tee /tmp/price-run.json

      - name: Refuse a run that changed too much
        run: python tools/pricefeed_guard.py --base origin/main

      - name: Tests must still pass
        run: python -m pytest -q

      - name: Open a data-only pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "no price changes"; exit 0
          fi
          branch="pricefeed/$(date -u +%Y%m%d-%H%M)"
          git config user.name "vehicle-market-master price watcher"
          git config user.email "noreply@github.com"
          git checkout -b "$branch"
          git add vehreg/data/2026/market
          git commit -m "Price feed: $(python -c "
          import json; d=json.load(open('/tmp/price-run.json'))
          print(f\"{d['canonical_offers']} offers, {d['review_items']} for review\")")"
          git push -u origin "$branch"
          gh pr create --title "Price feed $(date -u +%Y-%m-%d\ %H:%M)" \
            --body "Automated price harvest. Canonical offers only; everything ambiguous is in the review queue and is not published." \
            --base main --head "$branch"
