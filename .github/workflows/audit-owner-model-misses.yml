name: Inspect owner rule catalog misses

on:
  push:
    branches: [feature/owner-powertrain-rules]
    paths: [.github/workflows/audit-owner-model-misses.yml]

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/owner-powertrain-rules
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Build and inspect missing owner models
        env:
          VEHREG_DB: /tmp/misses.sqlite3
        run: |
          python - <<'PY'
          from pathlib import Path
          from vehreg.web_bootstrap import bootstrap_database
          from vehreg.db import connect
          db=Path('/tmp/misses.sqlite3')
          bootstrap_database(db)
          c=connect(db)
          targets=[('AUDI','Q7'),('AUDI','A6'),('LEXUS','IS'),('LEXUS','LS'),('TOYOTA','PRIUS')]
          for brand, token in targets:
              print('\nTARGET', brand, token)
              rows=c.execute("""
                select 'FACT' src, period, raw_label, grain, unit_id, sum(units) units
                from fact_registration
                where upper(raw_label) like ? and upper(raw_label) like ?
                group by period,raw_label,grain,unit_id
                union all
                select 'REVIEW' src, period, raw_label, reason grain, coalesce(best_guess,'') unit_id, sum(units) units
                from ingest_review
                where upper(raw_label) like ? and upper(raw_label) like ?
                group by period,raw_label,reason,best_guess
                order by period, src, units desc
              """,(f'%{brand}%',f'%{token}%',f'%{brand}%',f'%{token}%')).fetchall()
              print('ROWS',len(rows),'UNITS',sum(float(r['units']) for r in rows))
              for r in rows[:80]: print(dict(r))
          # Also list all catalog-resolved Audi/Lexus/Toyota model names that contain these tokens.
          for brand in ('Audi','Lexus','Toyota'):
              print('\nDIM',brand)
              for r in c.execute("select distinct brand,model,unit_id from dim_unit where brand=? and grain='MODEL' order by model",(brand,)):
                  if any(t in (r['model'] or '').upper() for t in ('Q7','A6','IS','LS','PRIUS')):
                      print(dict(r))
          c.close()
          PY
      - name: Remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/audit-owner-model-misses.yml
          git commit -m 'Remove owner model miss audit workflow'
          git push origin HEAD:feature/owner-powertrain-rules
