name: Audit owner powertrain rules

on:
  push:
    branches:
      - feature/owner-powertrain-rules
    paths:
      - .github/workflows/audit-owner-powertrain-rules.yml

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/owner-powertrain-rules
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Build committed warehouse and audit
        env:
          VEHREG_DB: /tmp/owner-rules.sqlite3
        run: |
          python - <<'PY'
          from pathlib import Path
          from vehreg.web_bootstrap import bootstrap_database
          from vehreg.db import connect
          from vehreg import coverage, review, cube
          from vehreg.powertrain_rules import RULES

          db = Path('/tmp/owner-rules.sqlite3')
          report = bootstrap_database(db)
          conn = connect(db)
          catalogs = review.load_catalogs()
          total = conn.execute('select coalesce(sum(units),0) u from fact_registration').fetchone()['u']
          facts = conn.execute('select count(*) n from fact_registration').fetchone()['n']
          print('BOOT', report)
          print('FACTS', facts, 'UNITS', total)

          wl = coverage.assumed_powertrain(conn, catalogs)
          print('WORKLIST', len(wl), 'UNITS', round(sum(float(x['units']) for x in wl)))
          for x in wl[:30]:
              print('WL', x)

          result = cube.run(conn, ['powertrain'], scopes='all')
          print('POWERTRAIN')
          for row in result.rows:
              print(row['powertrain'], round(row['units']))

          # Rulebook sanity: every non-wildcard rule key should correspond to at
          # least one catalog model in some loaded year, unless it is a deliberate
          # defensive spelling duplicate. Print misses for inspection.
          known = set()
          for cat in catalogs.values():
              for model in cat.models.values():
                  brand = cat.brands[model.brand_id].name_en
                  known.add((brand.upper(), model.name_en.upper()))
          misses = sorted({(r.brand, r.model) for r in RULES
                           if r.model != '*' and (r.brand.upper(), r.model.upper()) not in known})
          print('RULE_KEY_MISSES', len(misses))
          for miss in misses:
              print('MISS', miss)
          conn.close()
          PY
      - name: Run full tests again
        run: pytest -q
      - name: Remove one-shot audit workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/audit-owner-powertrain-rules.yml
          git commit -m 'Remove owner powertrain audit workflow'
          git push origin HEAD:feature/owner-powertrain-rules
