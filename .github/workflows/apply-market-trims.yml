name: Apply market trim layer

on:
  push:
    branches:
      - feature/market-trims

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply schema migration
        run: |
          python scripts/add_market_trim_layer.py
          python scripts/clarify_variant_vs_trim.py
      - name: Install
        run: python -m pip install -r requirements.txt pytest
      - name: Compile
        run: python -m compileall -q vehreg pages tests
      - name: Test
        run: pytest -q
      - name: Commit generated source changes
        run: |
          git config user.name "smgkikikiki-cloud"
          git config user.email "smgkikikiki@gmail.com"
          git add vehreg tests docs
          git commit -m "Clarify analytical variants versus retail trims" || true
          git push
